[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot-cli"
version = "0.1.0"
description = "Local-first developer control center for repository diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevPilot contributors" }]
keywords = ["developer-tools", "repository-analysis", "diagnostics", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Operating System :: OS Independent"]

[project.scripts]
devpilot = "devpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
