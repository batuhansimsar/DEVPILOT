name: Go race checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/go-ci.yml
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/go-ci.yml

permissions:
  contents: read

jobs:
  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race-enabled tests
        run: go test -race -count=1 ./...
