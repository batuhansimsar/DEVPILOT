name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -w cmd/devpilot/main.go internal/doctor/doctor.go internal/doctor/doctor_test.go
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/devpilot
