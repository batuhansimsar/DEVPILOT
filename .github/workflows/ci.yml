name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit tests
        run: go test -race ./...
        if: runner.os != 'Windows'
      - name: Unit tests (Windows)
        run: go test ./...
        if: runner.os == 'Windows'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/devpilot
