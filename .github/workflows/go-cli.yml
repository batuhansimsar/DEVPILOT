name: Go CLI verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go source formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go tests
        run: go test ./... -count=1
      - name: Go vet
        run: go vet ./...
      - name: Go CLI build
        run: go build ./cmd/devpilot
