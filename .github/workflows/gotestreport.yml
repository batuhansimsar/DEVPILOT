name: Go test report tool

on:
  push:
    paths:
      - 'tools/gotestreport/**'
      - '.github/workflows/gotestreport.yml'
  pull_request:
    paths:
      - 'tools/gotestreport/**'
      - '.github/workflows/gotestreport.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/gotestreport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/gotestreport/go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
