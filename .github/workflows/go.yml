name: Go CLI verification

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go.mod"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  go-cli:
    name: Go CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go format
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Build CLI
        run: go build ./cmd/devpilot
