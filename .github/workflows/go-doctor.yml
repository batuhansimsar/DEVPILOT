name: Go CLI checks

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - '.github/workflows/go-doctor.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - '.github/workflows/go-doctor.yml'

permissions:
  contents: read

jobs:
  go-cli:
    name: Go CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Race tests (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Formatting (Linux)
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l ./cmd ./internal)"
